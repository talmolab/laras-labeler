[project]
name = "laras-labeler"
version = "0.1.0"
description = "Local, pose-based, human-in-the-loop behavior classifier — a lightweight modern JAABA."
requires-python = ">=3.12"  # movement 0.17 requires >=3.12
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sleap-io>=0.8",
  "movement>=0.17",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2",
  # direct imports: h5py for the fast .slp pose read (poseio), bottleneck for the window features.
  # Both already arrive transitively (sleap-io, xarray[accel]) — pinned here so they stay.
  "h5py>=3.10",
  "bottleneck>=1.3",
  "pyarrow>=17",
  "joblib>=1.4",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  #
  # INTEL-macOS WHEEL FLOOR. Several of movement's transitive dependencies stopped publishing
  # x86_64 macOS wheels, so a plain `uvx --from git+...` there tries to build LLVM, PROJ and
  # OpenCV from source and fails. These pins select the newest version of each that still ships
  # a wheel for that platform, and apply ONLY there -- Apple Silicon and Linux resolve normally.
  #   llvmlite / numba   via xarray[accel]          wheels stop at llvmlite 0.45
  #   pyproj             via xarray[viz] -> cartopy wheels stop at 3.7.0
  #   opencv             via movement                wheels stop at 4.10
  "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyproj<3.7.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "opencv-python-headless<4.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# NOTE (supersedes an earlier note here): movement 0.17 forces xarray[accel,io,viz]. That earlier
# note named cartopy/pyproj as the only blocker and said numba/llvmlite were not one. Measured on
# Intel macOS with uv, the resolution fails at llvmlite FIRST, then pyproj, then opencv -- all
# three are blockers, and all three are fixed by the markered pins above. The alternative, if a
# platform still cannot resolve, is to install movement's core without the viz extra
# (`uv pip install movement --no-deps` plus its runtime deps) or to add uv dependency overrides.

[project.scripts]
laras-labeler = "laras_labeler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laras_labeler"]
